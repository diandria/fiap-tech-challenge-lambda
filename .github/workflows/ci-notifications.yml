name: CI notifications

on:
  pull_request:
    # Caminho filtrado de proposito: mexer numa function nao roda o CI da
    # outra. E isso que torna os projetos independentes de fato, e nao pastas
    # no mesmo repositorio.
    paths:
      - 'functions/notifications/**'
      - '.github/workflows/ci-notifications.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: functions/notifications

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest

    # No nivel do job para que os passos decidam por presenca: `secrets` nao
    # existe no `if` de um job, mas `env` existe.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      # Historico completo: sem ele o Sonar perde o conceito de "codigo novo",
      # que e sobre o que os portoes de qualidade dele decidem.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # A Lambda procura por 'handler' no bundle. Sem este export a function
      # faz deploy e quebra em toda invocacao com Runtime.HandlerNotFound --
      # falha que os testes de composicao nao pegam.
      - name: O bundle exporta handler
        run: |
          node -e "
            const m = require('./dist/index.js');
            if (typeof m.handler !== 'function') {
              console.error('dist/index.js nao exporta handler');
              process.exit(1);
            }
            console.log('handler exportado');
          "

      - name: Analise do SonarQube
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: functions/notifications

      # Avisa em vez de falhar sem o servidor configurado: um CI que vive
      # vermelho por falta de credencial para de ser lido.
      - name: Avisar configuracao ausente
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN nao configurado — analise do SonarQube pulada."
