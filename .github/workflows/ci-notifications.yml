name: CI notifications

on:
  pull_request:
    # Path filter on purpose: touching one function does not run the other's
    # CI. That is what makes the projects genuinely independent.
    paths:
      - 'functions/notifications/**'
      - '.github/workflows/ci-notifications.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: functions/notifications

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest

    # At job level so steps can branch on presence: `secrets` is not available
    # in a job's `if`, but `env` is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      # Full history: without it Sonar loses the notion of "new code", which is
      # what its quality gates decide on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Lambda looks for 'handler' in the bundle. Without the export the
      # function deploys and fails on every invocation with
      # Runtime.HandlerNotFound, which the composition tests do not catch.
      - name: Bundle exports handler
        run: |
          node -e "
            const m = require('./dist/index.js');
            if (typeof m.handler !== 'function') {
              console.error('dist/index.js does not export handler');
              process.exit(1);
            }
            console.log('handler exported');
          "

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: functions/notifications

      # Warns rather than fails when the server is not configured: a CI left red
      # for a missing credential stops being read.
      - name: Report missing configuration
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not configured - SonarQube analysis skipped."
