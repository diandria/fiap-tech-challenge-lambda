name: CD notifications

on:
  push:
    branches: [main]
    paths:
      - 'functions/notifications/**'
      - 'terraform/**'
      - '.github/workflows/cd-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-lambda
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Publicar function notifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_app_base_url: ${{ secrets.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Uma operacao real, e nao sts get-caller-identity: quando o Learner Lab
      # revoga a sessao (policy voc-cancel-cred), o sts continua respondendo a
      # identidade e so as chamadas de verdade sao negadas. Checar com sts
      # deixaria o workflow seguir e falhar adiante, com erro que nao aponta
      # para a causa.
      - name: Conferir credencial
        run: |
          aws ec2 describe-vpcs --max-items 1 > /dev/null 2>&1 || {
            echo "::error::Credencial da AWS ausente, expirada ou revogada. A do Learner Lab cai quando a sessao do lab para: rode Start Lab e depois ./scripts/refresh-aws-secrets.sh"
            exit 1
          }

      # As DUAS functions, e nao so a desta pipeline.
      #
      # As pipelines sao independentes, mas o estado do Terraform e um so: o
      # `apply` cobre a configuracao inteira, e o `archive_file` da outra
      # function empacota o `dist/index.js` dela. Construir so uma faz o apply
      # morrer em "could not archive missing file", apontando para um caminho
      # que nada nesta pipeline mexeu -- erro que nao parece ter relacao com a
      # mudanca que disparou o deploy.
      - name: Build das functions
        run: |
          (cd functions/auth && npm ci && npm run build)
          (cd functions/notifications && npm ci && npm run build)

      - name: terraform apply
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -no-color

      # Apply verde nao prova que a function funciona: o deploy anterior desta
      # function subiu sem o export handler e quebrava em toda invocacao.
      - name: Invocar a function e conferir a resposta
        run: |
          aws lambda invoke --function-name car-repair-shop-notifications \
            --payload "$(echo -n '{"Records":[]}' | base64 -w0)" \
            /tmp/out.json > /tmp/meta.json
          cat /tmp/meta.json
          if grep -q FunctionError /tmp/meta.json; then
            echo "::error::A function respondeu com erro"
            cat /tmp/out.json
            exit 1
          fi
          echo "invocacao sem erro"
