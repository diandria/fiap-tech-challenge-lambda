name: CD auth

on:
  push:
    branches: [main]
    paths:
      - 'functions/auth/**'
      - 'terraform/**'
      - '.github/workflows/cd-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-lambda
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Publish auth function
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # A real operation, not sts get-caller-identity: when the Learner Lab
      # revokes the session, sts keeps answering and only real calls are denied.
      # Checking with sts would let the workflow fail later, far from the cause.
      - name: Verify credentials
        run: |
          aws ec2 describe-vpcs --max-items 1 > /dev/null 2>&1 || {
            echo "::error::AWS credentials missing, expired or revoked. Learner Lab credentials drop when the lab session stops: run Start Lab, then ./scripts/refresh-aws-secrets.sh"
            exit 1
          }

      # BOTH functions, not only this pipeline's.
      #
      # The pipelines are independent but the Terraform state is one: `apply`
      # covers the whole configuration, and the other function's `archive_file`
      # packages its own dist/index.js. Building only one makes apply die with
      # "could not archive missing file", pointing at a path this pipeline never
      # touched.
      - name: Build both functions
        run: |
          (cd functions/auth && npm ci && npm run build)
          (cd functions/notifications && npm ci && npm run build)

      - name: terraform apply
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -no-color

      # A green apply does not prove the function works: an earlier deploy
      # shipped without the handler export and broke on every invocation.
      - name: Invoke the function and check the response
        run: |
          aws lambda invoke --function-name car-repair-shop-auth \
            --payload "$(echo -n '{"body":"{}"}' | base64 -w0)" \
            /tmp/out.json > /tmp/meta.json
          cat /tmp/meta.json
          if grep -q FunctionError /tmp/meta.json; then
            echo "::error::The function answered with an error"
            cat /tmp/out.json
            exit 1
          fi
          echo "invocation returned no error"
